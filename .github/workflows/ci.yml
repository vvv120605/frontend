name: CI Frontend

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: Instalar, testear y compilar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

  docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t sonidovivo-frontend .